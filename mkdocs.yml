# Gerado por fernando-moretes/platform (TechDocs do Backstage). O conteudo e do
# repositorio: escreva em docs/*.md; este arquivo so lista as paginas.
site_name: ref-rs-visao-real
site_description: "Public Fernando Moretes repository connected to the broader architecture and engineering portfolio."
repo_url: https://github.com/fernandofatech/ref-rs-visao-real
edit_uri: edit/main/docs/
docs_dir: docs
plugins:
  - techdocs-core
nav:
  - Visão geral: index.md
  - Arquitetura: arquitetura.md
  - Operação: operacao.md
  - API: api.md
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
